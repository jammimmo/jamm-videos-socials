name: Qualify Jamm Immo advice source

on:
  repository_dispatch:
    types: [qualify-jamm-tip-source]

concurrency:
  group: advice-source-${{ github.event.client_payload.sourceJob.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Prepare narration and speech tools before claiming a paid take
        run: bash scripts/prepare-tip-runtime.sh --install
      - name: Verify source workflow contracts
        run: |
          npm run lint
          node --import tsx --test scripts/tip-source-attempt.test.mjs scripts/run-tip-source-work.test.mjs
          python -m unittest discover -s scripts -p test_audit_tip_v11_source.py
      - name: Generate and qualify one acknowledged source attempt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: node --import tsx scripts/run-tip-source-work.mjs
