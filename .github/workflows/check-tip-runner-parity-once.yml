name: Hosted renderer parity fixture 210a640

on:
  push:
    branches: [ci/renderer-parity-hosted-210a640-20261116]

permissions:
  contents: read

jobs:
  synthetic-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 210a640bbcfcb0d25f058c0d5196fd297ad45621
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Install the same Ubuntu fixture media tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify exact candidate and synthetic renderer parity
        env:
          TIP_PARITY_EXPECTED_SHA: 210a640bbcfcb0d25f058c0d5196fd297ad45621
        run: bash scripts/check-tip-runner-parity.sh "$RUNNER_TEMP/tip-runner-parity.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tip-runner-parity-hosted
          path: ${{ runner.temp }}/tip-runner-parity.json
          if-no-files-found: error
          retention-days: 7
