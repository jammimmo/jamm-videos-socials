name: Render JAMM videos

# Manually triggered. Choose a single video or 'all' to fan out 10 parallel
# jobs. Each job renders one MP4 and uploads it as an artifact.
#
# Required repo secret: GEMINI_API_KEY  (Google AI Studio key for Gemini TTS)

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Which video to render (or "all" for matrix-parallel)'
        type: choice
        required: true
        default: all
        options:
          - all
          - fresh-compteurs
          - 01-paiement-avant-visite
          - 02-caution-mobile-money
          - 03-tester-eau
          - 04-visite-jour-nuit
          - 05-trajet-dakar
          - 06-verifier-proprietaire
          - 07-contrat-bail
          - 08-clauses-bail
          - 09-recu-paiement
          - 10-compteurs-entree

jobs:
  prepare:
    name: Decide matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.video_id }}" = "all" ]; then
            echo 'matrix=["01-paiement-avant-visite","02-caution-mobile-money","03-tester-eau","04-visite-jour-nuit","05-trajet-dakar","06-verifier-proprietaire","07-contrat-bail","08-clauses-bail","09-recu-paiement","10-compteurs-entree"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["${{ inputs.video_id }}"]' >> $GITHUB_OUTPUT
          fi

  render:
    name: Render ${{ matrix.video_id }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        video_id: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        if: matrix.video_id == 'fresh-compteurs'
        with:
          python-version: '3.11'

      - name: Install CPU speech alignment for the fresh prototype
        if: matrix.video_id == 'fresh-compteurs'
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install openai-whisper==20250625

      - name: Install media duration verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Verify the fresh prototype
        if: matrix.video_id == 'fresh-compteurs'
        run: |
          npm run lint
          npm run test:dispatch
          python -m unittest discover -s scripts -p 'test_align_narration.py'

      - name: Install Remotion browser (Chromium)
        run: npx remotion browser ensure

      - name: Validate content
        if: matrix.video_id != 'fresh-compteurs'
        run: npm run content:build

      - name: Render ${{ matrix.video_id }}
        if: matrix.video_id != 'fresh-compteurs'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run render:batch -- --id ${{ matrix.video_id }}

      - name: Render the fresh prototype in one spoken take
        if: matrix.video_id == 'fresh-compteurs'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run render:batch -- --spec-file scripts/fixtures/fresh-compteurs.spec.json --voice-only

      - name: Upload MP4 artifact
        if: matrix.video_id != 'fresh-compteurs'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.video_id }}-mp4
          path: out/batch/${{ matrix.video_id }}.mp4
          retention-days: 30
          if-no-files-found: error

      - name: Keep fresh prototype audit artifacts, including failed attempts
        if: ${{ always() && matrix.video_id == 'fresh-compteurs' }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-compteurs-v2-audit
          path: |
            out/batch/fresh-compteurs-v2.mp4
            out/batch/fresh-compteurs-v2.alignment.json
            out/batch/fresh-compteurs-v2.props.json
            out/batch/fresh-compteurs-v2.media.json
            out/batch/fresh-compteurs-v2.spec.json
            public/audio/voiceovers/fresh-compteurs-v2.wav
          retention-days: 30
          if-no-files-found: warn
