name: Check tip renderer

on:
  pull_request:
    branches:
      - main
      - 'feature/tip-v11-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Check Ubuntu archive selection
        run: python -m unittest discover -s scripts -p test_install_tip_ffmpeg.py
      - name: Install FFmpeg for narration runtime tests
        run: python -I scripts/install_tip_ffmpeg.py
      - name: Run renderer source checks
        env:
          TIP_PARITY_EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/check-tip-runner-parity.sh --checks-only

  offline-render-smoke:
    name: Offline Remotion smoke
    if: github.base_ref == 'main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Install local network isolation tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iproute2
      - name: Render and audit the non-publishable fixture without outbound network
        env:
          TIP_PARITY_EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/check-tip-runner-parity.sh "$RUNNER_TEMP/tip-runner-parity.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tip-runner-parity-hosted
          path: ${{ runner.temp }}/tip-runner-parity.json
          if-no-files-found: error
          retention-days: 7
