name: One synthetic V11 frame capture hosted

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-codec-parity-hosted
  cancel-in-progress: false

jobs:
  codec:
    if: github.repository == 'jammimmo/jamm-videos-socials' && github.ref == 'refs/heads/qa/codec-parity-hosted-v2-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jammimmo/jamm-videos-socials
          ref: 148fc51d81291d09ea2d4985a50b7431f816c3c9
          path: codec-renderer
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Verify the attested codec and isolation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --allow-downgrades ffmpeg=7:6.1.1-3ubuntu5 iproute2
          for tool in ffmpeg ip unshare; do command -v "$tool" >/dev/null; done
          ffmpeg_path=$(command -v ffmpeg)
          test "$(ffmpeg -version | sed -n '1p')" = 'ffmpeg version 6.1.1-3ubuntu5 Copyright (c) 2000-2023 the FFmpeg developers'
          test "$(sha256sum "$ffmpeg_path" | cut -d ' ' -f 1)" = ed16af623947494a72e284b6eb8ff225f2da22b38b5d5069c2fd4b4ba3384e41
          test "$(node --version)" = v22.20.0
          test "$(npm --version)" = 10.9.3
      - name: Capture one V11 frame as JPEG and same-state PNG
        working-directory: codec-renderer
        shell: bash
        env:
          TIP_PARITY_EXPECTED_SHA: 148fc51d81291d09ea2d4985a50b7431f816c3c9
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/codec-parity-receipts"
          bash scripts/check-tip-single-frame.sh "$RUNNER_TEMP/codec-parity-receipts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-frame-capture-hosted
          path: |
            ${{ runner.temp }}/codec-parity-receipts/receipt.json
            ${{ runner.temp }}/codec-parity-receipts/frame.jpg
            ${{ runner.temp }}/codec-parity-receipts/frame.png
          if-no-files-found: error
          retention-days: 7
