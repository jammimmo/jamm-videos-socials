name: Check tip renderer

on:
  pull_request:
    branches:
      - main
      - 'feature/tip-v11-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for narration runtime tests
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run renderer source checks
        env:
          TIP_PARITY_EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/check-tip-runner-parity.sh --checks-only

  offline-render-smoke:
    name: Offline Remotion smoke
    if: github.base_ref == 'main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local media tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Render and audit the non-publishable fixture without outbound network
        env:
          TIP_PARITY_EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/check-tip-runner-parity.sh "$RUNNER_TEMP/tip-runner-parity.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tip-runner-parity-hosted
          path: ${{ runner.temp }}/tip-runner-parity.json
          if-no-files-found: error
          retention-days: 7
