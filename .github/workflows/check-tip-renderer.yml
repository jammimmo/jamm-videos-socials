name: Bounded synthetic codec parity hosted

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-codec-parity-hosted
  cancel-in-progress: false

jobs:
  codec:
    if: github.repository == 'jammimmo/jamm-videos-socials' && github.ref == 'refs/heads/qa/codec-parity-hosted-v2-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jammimmo/jamm-videos-socials
          ref: 49c9e51bd92cff4f28b7eca35411d287628ec9af
          path: codec-renderer
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Provision only codec and network isolation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg iproute2
          test "$(node --version)" = v22.20.0
          test "$(npm --version)" = 10.9.3
      - name: Isolate and measure twelve synthetic frames
        working-directory: codec-renderer
        shell: bash
        env:
          TIP_PARITY_EXPECTED_SHA: 49c9e51bd92cff4f28b7eca35411d287628ec9af
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/codec-parity-receipts"
          bash scripts/check-tip-codec-parity.sh "$RUNNER_TEMP/codec-parity-receipts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codec-parity-hosted
          path: |
            ${{ runner.temp }}/codec-parity-receipts/receipt.json
            ${{ runner.temp }}/codec-parity-receipts/*.log
          if-no-files-found: error
          retention-days: 7
