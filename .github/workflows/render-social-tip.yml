name: Render Jamm Immo social tip

on:
  repository_dispatch:
    types: [render-jamm-tip]

concurrency:
  group: render-social-tip-${{ github.event.client_payload.job.id || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event.client_payload.evidence.destinationMediaContract == 'tip-v11-destination-manifest-v1' && 45 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Validate and materialise the signed delivery contract
        run: |
          node scripts/materialize-dispatched-tip.mjs \
            --event "$GITHUB_EVENT_PATH" \
            --spec dispatched-tip.json \
            --env "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'

      - name: Install legacy FFmpeg
        if: github.event.client_payload.contract == 'jamm-tip-render-v1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install legacy speech alignment
        if: github.event.client_payload.contract == 'jamm-tip-render-v1'
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install openai-whisper==20250625

      - name: Prepare the common V11 speech runtime
        if: github.event.client_payload.contract == 'jamm-tip-render-v2' || github.event.client_payload.contract == 'jamm-tip-render-v3-reviewed-narration'
        run: bash scripts/prepare-tip-runtime.sh --install

      - name: Verify sentence alignment
        run: python -m unittest discover -s scripts -p 'test_*align*.py'

      - name: Verify dispatch and official social brand
        run: npm run test:dispatch

      - name: Ensure Remotion Chromium
        run: npx remotion browser ensure

      - name: Render the dynamic social tip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIPS_V11_ASSISTANT_PUBLIC: ${{ vars.TIPS_V11_ASSISTANT_PUBLIC }}
        run: |
          export TIP_V11_ALIGNMENT_FAILURE_CODE_FILE="${RUNNER_TEMP}/tip-v11-alignment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export TIP_V11_ALIGNMENT_FAILURE_DIAGNOSTIC_FILE="${TIP_V11_ALIGNMENT_FAILURE_CODE_FILE}.diagnostic.json"
          npm run render:batch -- --spec-file "${TIP_SPEC_FILE}" --voice-only

      - name: Measure V11 audio, French speech, captions and CTA in the rendered MP4
        timeout-minutes: 6
        if: github.event.client_payload.contract == 'jamm-tip-render-v2' || github.event.client_payload.contract == 'jamm-tip-render-v3-reviewed-narration'
        continue-on-error: ${{ github.event.client_payload.contract == 'jamm-tip-render-v2' && github.event.client_payload.evidence.mediaStorageMode != 'job_owned_v1' }}
        run: |
          failure_code_file="${RUNNER_TEMP}/tip-v11-alignment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          record_audit_failure() {
            case "$1" in
              render_audit_dependency_unavailable|render_audit_unavailable|render_audit_rejected) ;;
              *) return 2 ;;
            esac
            printf '%s\n' "$1" > "${failure_code_file}"
            exit 1
          }
          python -I scripts/install_tip_ffmpeg.py --audit-tools || record_audit_failure render_audit_dependency_unavailable
          STEM="tip-${TIP_JOB_ID}"
          RAW_WAV="${TIP_PRIVATE_NARRATION_FILE:-public/audio/voiceovers/${STEM}.wav}"
          REPORT="out/batch/${STEM}.audit.json"
          if python scripts/audit_tip_v11.py \
            --video "out/batch/${STEM}.mp4" \
            --alignment "out/batch/${STEM}.alignment.json" \
            --render-manifest "out/batch/${STEM}.manifest.json" \
            --render-props "out/batch/${STEM}.props.json" \
            --raw-wav "${RAW_WAV}" \
            --narration-wav "public/audio/voiceovers/${STEM}-v11.wav" \
            --mix-wav "public/audio/voiceovers/${STEM}-v11-mix.wav" \
            --ocr-language fra --measure-final-french \
            --brand-logo public/tip-v11/logo.png --report "${REPORT}"; then
            test -s "${REPORT}" || record_audit_failure render_audit_unavailable
          elif [ -s "${REPORT}" ]; then
            # Failed metrics leave their private report available for the
            # bounded terminal classification, but never authorize an upload.
            record_audit_failure render_audit_rejected
          else
            record_audit_failure render_audit_unavailable
          fi

      - name: Stream the MP4 to the Jamm Immo Worker
        if: env.TIP_DESTINATION_MEDIA_CONTRACT != 'tip-v11-destination-manifest-v1'
        run: |
          set +x
          failure_code_file="${RUNNER_TEMP}/tip-v11-alignment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          record_delivery_failure() {
            case "$1" in
              render_audit_unavailable|render_audit_rejected|render_evidence_unavailable|render_attestation_unavailable) ;;
              *) return 2 ;;
            esac
            printf '%s\n' "$1" > "${failure_code_file}"
            exit 1
          }
          VIDEO="out/batch/tip-${TIP_JOB_ID}.mp4"
          test -s "${VIDEO}"
          SHA256=$(sha256sum "${VIDEO}" | cut -d' ' -f1)
          DURATION=$(node -p "require('./out/batch/tip-${TIP_JOB_ID}.media.json').durationHeader")
          REPORT="out/batch/tip-${TIP_JOB_ID}.audit.json"
          EVIDENCE=""
          ATTESTATION=""
          if [ -s "${REPORT}" ]; then
            EVIDENCE=$(node scripts/tip-v11-render-evidence.mjs "${REPORT}" "${SHA256}") \
              || { EVIDENCE=""; [ "${TIP_REQUIRED_RENDER_ATTESTATION:-}" != 1 ] \
                || record_delivery_failure render_evidence_unavailable; }
          fi
          if [ -n "${EVIDENCE}" ]; then
            ATTESTATION=$(printf '%s' "${EVIDENCE}" | node scripts/tip-v11-workflow-oidc.mjs) \
              || { ATTESTATION=""; [ "${TIP_REQUIRED_RENDER_ATTESTATION:-}" != 1 ] \
                || record_delivery_failure render_attestation_unavailable; }
          fi
          if [ "${TIP_REQUIRED_RENDER_ATTESTATION:-}" = 1 ]; then
            [ -s "${REPORT}" ] || record_delivery_failure render_audit_unavailable
            [ -n "${EVIDENCE}" ] || record_delivery_failure render_evidence_unavailable
            [ -n "${ATTESTATION}" ] || record_delivery_failure render_attestation_unavailable
          fi
          if TIP_RENDER_EVIDENCE="${EVIDENCE}" TIP_WORKFLOW_ATTESTATION="${ATTESTATION}" \
            node scripts/deliver-tip-video.mjs "${VIDEO}" "${SHA256}" "${DURATION}"; then
            :
          else
            delivery_status=$?
            if [ "${delivery_status}" -eq 75 ]; then
              printf '%s\n' 'pending' > "${RUNNER_TEMP}/tip-delivery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
            exit "${delivery_status}"
          fi
          if [ -n "${ATTESTATION}" ]; then
            unset ATTESTATION
            node scripts/deliver-tip-v11-report.mjs "${REPORT}" || true
          fi

      - name: Deliver the master, destination variants and bound report
        if: env.TIP_DESTINATION_MEDIA_CONTRACT == 'tip-v11-destination-manifest-v1'
        timeout-minutes: 17
        run: |
          set +x
          node scripts/deliver-tip-destination-attempt.mjs

      - name: Report a terminal renderer failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          TIP_FAILURE_CONTRACT: ${{ github.event.client_payload.contract }}
        run: |
          if [ -f "${RUNNER_TEMP}/tip-delivery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]; then
            echo 'Tip delivery remains subject to existing attempt recovery.'
            exit 0
          fi
          if [ -n "${TIP_UPLOAD_URL:-}" ] && [ -n "${TIP_CALLBACK_TOKEN:-}" ] && [ -n "${TIP_JOB_ID:-}" ]; then
            reason="render workflow failed"
            code_file="${RUNNER_TEMP}/tip-v11-alignment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            if [ -f "${code_file}" ]; then
              IFS= read -r code < "${code_file}" || code=""
              case "${code}" in
                narration_duration_out_of_range)
                  reason="V11 narration duration out of range"
                  ;;
                signature_evidence_insufficient|signature_boundary_unconfirmed|signature_tail_too_quiet|signature_closing_unrecognized|signature_retry_insufficient|phone_evidence_unconfirmed|website_evidence_unconfirmed|script_evidence_unconfirmed|alignment_evidence_invalid)
                  reason="V11 speech alignment failed (${code})"
                  ;;
                render_audit_dependency_unavailable|render_audit_unavailable|render_audit_rejected|render_evidence_unavailable|render_attestation_unavailable)
                  reason="V11 technical delivery proof failed (${code})"
                  ;;
              esac
            fi
            case "${TIP_FAILURE_CONTRACT}" in
              jamm-tip-render-v2|jamm-tip-render-v3-reviewed-narration)
                TIP_VIDEO_DIAGNOSTIC_FILE="${code_file}.diagnostic.json" \
                  node scripts/deliver-tip-failure.mjs "${reason}; GitHub run ${GITHUB_RUN_ID}"
                ;;
              jamm-tip-render-v1)
                curl --silent --show-error --output /dev/null --write-out 'Renderer failure callback HTTP %{http_code}\n' \
                  -X POST "${TIP_UPLOAD_URL}&status=failed" \
                  -H "Authorization: Bearer ${TIP_CALLBACK_TOKEN}" \
                  -H "X-Job-Id: ${TIP_JOB_ID}" \
                  -H "X-Error: ${reason}; GitHub run ${GITHUB_RUN_ID}" || true
                ;;
            esac
          fi

      - name: Remove the staged private narration
        if: ${{ always() }}
        run: |
          if [ -n "${TIP_PRIVATE_NARRATION_FILE:-}" ]; then
            rm -f -- "${TIP_PRIVATE_NARRATION_FILE}" "${TIP_PRIVATE_NARRATION_FILE}.processing.json"
          fi

      - name: Keep a legacy render artifact for audit
        if: ${{ always() && github.event.client_payload.contract == 'jamm-tip-render-v1' }}
        uses: actions/upload-artifact@v4
        with:
          name: social-tip-${{ github.event.client_payload.job.id }}
          path: |
            out/batch/*.mp4
            out/batch/*.alignment.json
            out/batch/*.props.json
            out/batch/*.media.json
            public/audio/voiceovers/*.wav
          retention-days: 14
          if-no-files-found: ignore
